services:
  # Base de datos: MongoDB
  mongo:
    image: mongo:7
    container_name: compra-coches-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  # Almacenamiento de objetos S3 local: MinIO
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: compra-coches-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000" # API S3 (sirve las imágenes)
      - "9001:9001" # Consola web de administración
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Servicio de un solo uso: crea el bucket y lo deja público (lectura anónima)
  createbuckets:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    container_name: compra-coches-createbuckets
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb --ignore-existing local/car-photos;
      mc anonymous set download local/car-photos;
      echo 'Bucket car-photos listo y público';
      exit 0;
      "

volumes:
  mongo-data:
    name: semilla_mongo-data-local
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PWD}/voldata/mongo

  minio-data:
    name: semilla_minio-data-local
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PWD}/voldata/minio
